# Docker's embedded resolver refreshes the backend address after container recreation.
upstream citerag_backend {
    zone citerag_backend 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server backend:8000 resolve;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://citerag_backend/;
        proxy_connect_timeout 5s;
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
