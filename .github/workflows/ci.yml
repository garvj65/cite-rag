name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_USER: citerag
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: citerag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U citerag -d citerag_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://citerag:ci-only-password@127.0.0.1:5432/citerag_test
      ENABLE_REAL_PROVIDERS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.4"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - name: Build backend Docker image
        run: docker build -f backend/Dockerfile -t citerag-backend:ci .
      - name: Validate Compose configuration
        run: cp .env.example .env && docker compose config --quiet
