name: Explicit Gemini evaluation
on:
  workflow_dispatch:
    inputs:
      allow_real_calls:
        description: "Allow Gemini API calls using the repository secret (subject to your account quotas/billing)"
        type: boolean
        required: true
        default: false
      strategy:
        description: Retrieval strategy (all runs three sequential evaluations)
        type: choice
        options: [hybrid, vector, keyword, all]
        default: vector
      question_set:
        description: Full benchmark or focused wording/refusal regression (8 existing questions)
        type: choice
        options: [full, wording-check]
        default: full
      retrieval_only:
        description: Measure retrieval only (no chat calls; answer metrics N/A)
        type: boolean
        default: false
      chat_model:
        description: Explicit chat model for this run (no automatic fallback)
        type: choice
        options: [gemini-3.5-flash-lite, gemini-3.8-flash, gemini-3.6-flash]
        default: gemini-3.5-flash-lite
      delay_seconds:
        description: Pause between questions, excluded from latency (0–300 seconds)
        type: number
        default: 0
      browser_check:
        description: Check real cited answer and refusal in Chromium after answer evaluation
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: explicit-evaluation
  cancel-in-progress: false
jobs:
  evaluate:
    if: inputs.allow_real_calls
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_USER: citerag
          POSTGRES_PASSWORD: disposable-evaluation-only
          POSTGRES_DB: citerag_eval
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U citerag -d citerag_eval"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://citerag:disposable-evaluation-only@127.0.0.1:55432/citerag_eval
      ENABLE_REAL_PROVIDERS: "true"
      PROVIDER_BACKOFF_SECONDS: "30"
      PROVIDER_MAX_BACKOFF_SECONDS: "60"
      EMBEDDING_PROVIDER: gemini
      LLM_PROVIDER: gemini
      GEMINI_EMBEDDING_MODEL: gemini-embedding-2
      GEMINI_CHAT_MODEL: ${{ inputs.chat_model }}
      GEMINI_CHAT_REQUESTS_PER_MINUTE: ${{ inputs.chat_model == 'gemini-3.5-flash-lite' && '12' || '4' }}
      GEMINI_EMBEDDING_INPUTS_PER_MINUTE: "90"
      SEARCH_STRATEGY: vector
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      EVAL_RETRIEVAL_ONLY: ${{ inputs.retrieval_only }}
      EVAL_STRATEGY: ${{ inputs.strategy }}
      EVAL_DELAY_SECONDS: ${{ inputs.delay_seconds }}
      EVAL_QUESTION_IDS: ${{ inputs.question_set == 'wording-check' && 'q01,q02,q05,q08,q13,q20,q25,q30' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require the user dataset and repository secret
        shell: bash
        run: |
          test -s eval/golden.jsonl || { echo 'Add your own eval/golden.jsonl questions and gold pages first.'; exit 1; }
          test -n "$GEMINI_API_KEY" || { echo 'Configure GEMINI_API_KEY in repository Actions secrets; never paste it into code or chat.'; exit 1; }
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.4"
          enable-cache: true
      - id: dependencies
        run: uv sync --frozen
      - name: Validate data and pacing before any provider call
        run: |
          uv run python -m eval.validate
          uv run python - <<'PY'
          import os
          from eval.models import EvaluationOptions
          EvaluationOptions(question_delay_seconds=float(os.environ["EVAL_DELAY_SECONDS"]))
          PY
      - name: Check provider access with sanitized diagnostics
        shell: bash
        run: |
          flags=()
          if [ "$EVAL_RETRIEVAL_ONLY" = true ]; then flags+=(--embedding-only); fi
          uv run python scripts/check_providers.py --allow-real-calls "${flags[@]}"
      - name: Download the approved public corpus and check document identities
        run: |
          uv run python scripts/download_corpus.py
          uv run python - <<'PY'
          import hashlib
          from pathlib import Path
          from app.settings import Settings
          from eval.schema import load_golden
          questions, _ = load_golden(Path("eval/golden.jsonl"), Settings().max_query_characters)
          downloaded = {hashlib.sha256(p.read_bytes()).hexdigest() for p in Path("corpus").glob("*.pdf")}
          expected = {page.doc_id for q in questions for page in q.gold_pages}
          if not expected.issubset(downloaded):
              raise SystemExit("Gold document identities do not match the downloaded PDFs. Check the corpus reference before embedding.")
          PY
      - name: Restore compatible corpus index
        uses: actions/cache/restore@v4
        id: index_cache
        with:
          path: /tmp/citerag-index
          key: >-
            public-index-pg16-pgv081-v1-${{ runner.os }}-${{ hashFiles('corpus/*.pdf', 'corpus/manifest.yaml', 'backend/app/ingestion/**/*.py', 'backend/app/db/**/*.py', 'backend/app/ingest.py', 'backend/app/settings.py', 'backend/app/providers/http.py', 'backend/app/providers/interfaces.py', 'backend/app/providers/factory.py', 'backend/migrations/**/*.py', 'uv.lock') }}
      - name: Restore or build the index once for all strategies and browser checks
        id: ingestion
        env:
          INDEX_CACHE_HIT: ${{ steps.index_cache.outputs.cache-hit }}
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          if [ "$INDEX_CACHE_HIT" = true ]; then
            docker exec -i "$POSTGRES_CONTAINER" pg_restore -U citerag -d citerag_eval --no-owner --no-privileges --exit-on-error < /tmp/citerag-index/index.dump
            echo 'Restored compatible public-corpus index; no document embedding calls.'
          else
            uv run alembic -c backend/alembic.ini upgrade head
            uv run python -m app.ingest --path corpus/
            mkdir -p /tmp/citerag-index
            docker exec "$POSTGRES_CONTAINER" pg_dump -U citerag -d citerag_eval --format=custom --no-owner --no-privileges > /tmp/citerag-index/index.dump
          fi
          uv run python -m eval.validate --check-index
      - name: Save successful public-corpus index
        if: steps.index_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/citerag-index
          key: ${{ steps.index_cache.outputs.cache-primary-key }}
      - name: Measure selected strategies
        shell: bash
        run: |
          strategies=("$EVAL_STRATEGY")
          if [ "$EVAL_STRATEGY" = all ]; then strategies=(vector keyword hybrid); fi
          flags=()
          if [ "$EVAL_RETRIEVAL_ONLY" = true ]; then flags+=(--retrieval-only); fi
          if [ -n "$EVAL_QUESTION_IDS" ]; then flags+=(--question-ids "$EVAL_QUESTION_IDS"); fi
          status=0
          for strategy in "${strategies[@]}"; do
            uv run python -m eval.run --strategy "$strategy" --k 5 --seed 42 --delay-seconds "$EVAL_DELAY_SECONDS" --output eval/results/current "${flags[@]}" || status=1
          done
          exit "$status"
      - uses: actions/setup-node@v4
        id: browser_node
        if: ${{ !cancelled() && !inputs.retrieval_only && inputs.browser_check && steps.ingestion.outcome == 'success' }}
        with:
          node-version: "24"
      - uses: actions/cache@v4
        if: ${{ !cancelled() && steps.browser_node.outcome == 'success' }}
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Prepare explicit real browser check
        id: browser_ready
        if: ${{ !cancelled() && steps.browser_node.outcome == 'success' }}
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npx playwright install --with-deps chromium
      - name: Check real answers in the browser
        if: ${{ !cancelled() && steps.browser_ready.outcome == 'success' }}
        shell: bash
        run: |
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/citerag-api.log 2>&1 &
          api_pid=$!
          npm --prefix frontend run dev -- --port 8080 > /tmp/citerag-ui.log 2>&1 &
          ui_pid=$!
          trap 'kill "$api_pid" "$ui_pid" 2>/dev/null || true' EXIT
          uv run python - <<'PY'
          import time
          import httpx
          for attempt in range(30):
              try:
                  for url in ("http://127.0.0.1:8000/health", "http://127.0.0.1:8080/api/config"):
                      httpx.get(url, timeout=1, trust_env=False).raise_for_status()
                  break
              except httpx.HTTPError:
                  if attempt == 29:
                      raise SystemExit("Browser services did not become ready.") from None
                  time.sleep(1)
          PY
          node frontend/scripts/live-evaluation.ts --allow-real-calls
      - name: Publish measured aggregate table in run summary
        if: always() && steps.dependencies.outcome == 'success'
        run: |
          uv run python - <<'PY'
          import os
          from pathlib import Path
          from eval.models import EvaluationResult
          from eval.report import results_table
          results = [EvaluationResult.model_validate_json(p.read_text()) for p in sorted(Path("eval/results/current").glob("*.json"))]
          if results:
              table = results_table(results)
              print(table)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
                  scope = "Focused regression check (selected questions only)" if os.environ["EVAL_QUESTION_IDS"] else "Measured evaluation"
                  stream.write("## " + scope + "\n\n" + table + "\n\nDownload the artifact for raw records, errors, and reproduction metadata. Review the actual question/class counts and errors before reporting these numbers. No faithfulness judge is used.\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measured-evaluation-${{ github.run_id }}
          path: |
            eval/results/current/
            eval/results/browser-check.json
            eval/results/browser-*.png
          if-no-files-found: ignore
          retention-days: 14
